services:
  uk_ged_onlyoffice:
    image: onlyoffice/documentserver:8.2.2
    container_name: uk_ged_onlyoffice_dev
    restart: unless-stopped
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=uk_ged_onlyoffice_dev_secret
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
      - USE_UNAUTHORIZED_STORAGE=true
    volumes:
      - uk_ged_onlyoffice_dev_data:/var/www/onlyoffice/Data
      - uk_ged_onlyoffice_dev_log:/var/log/onlyoffice
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  uk_ged_onlyoffice_dev_data:
  uk_ged_onlyoffice_dev_log:
