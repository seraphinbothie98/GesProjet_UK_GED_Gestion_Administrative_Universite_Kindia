# ==============================================================================
# UK-GED - CONFIGURATION NGINX (STAGING / PRÉPRODUCTION)
# Domaine : staging-ged.universite.edu
# Université de Kindia
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name staging-ged.universite.edu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-ged.universite.edu;

    ssl_certificate /etc/letsencrypt/live/staging-ged.universite.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-ged.universite.edu/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # En-têtes pour environnement de préproduction (avec noindex)
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 100M;

    root /var/www/uk_ged_staging/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Backend Staging (Port 5001)
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    access_log /var/log/nginx/uk_ged_staging_access.log;
    error_log /var/log/nginx/uk_ged_staging_error.log warn;
}
