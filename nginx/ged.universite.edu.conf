# ==============================================================================
# UK-GED - CONFIGURATION NGINX OFFICIELLE (PRODUCTION)
# Domaine : ged.universite.edu
# Université de Kindia
# ==============================================================================

# 1. Redirection HTTP vers HTTPS obligatoire
server {
    listen 80;
    listen [::]:80;
    server_name ged.universite.edu;

    # Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Serveur HTTPS Principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ged.universite.edu;

    # Certificats SSL/TLS
    ssl_certificate /etc/letsencrypt/live/ged.universite.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ged.universite.edu/privkey.pem;

    # Protocoles et Chiffrements Sécurisés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # En-têtes de Sécurité HTTP Haut Niveau (HSTS, CSP, XFO)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Taille maximale des téléversements (jusqu'à 100 Mo pour gros documents administratifs & registres scannés)
    client_max_body_size 100M;

    # Compression GZIP
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript;

    # Fichiers Statiques Frontend (Vite Build)
    root /var/www/uk_ged/client/dist;
    index index.html;

    # Routage Single Page Application (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API Backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Proxy Fichiers Téléversés (Uploads / Documents / Signatures / Cachets)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering on;
        proxy_cache_valid 200 302 1d;
    }

    # Logs de Production Séparés
    access_log /var/log/nginx/uk_ged_production_access.log;
    error_log /var/log/nginx/uk_ged_production_error.log warn;
}

# 3. Serveur ONLYOFFICE Document Server (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name office.ged.universite.edu;

    ssl_certificate /etc/letsencrypt/live/ged.universite.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ged.universite.edu/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

    # WebSocket & Document Proxy
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    access_log /var/log/nginx/onlyoffice_production_access.log;
    error_log /var/log/nginx/onlyoffice_production_error.log warn;
}
